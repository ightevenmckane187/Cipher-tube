name: "🧙‍♂️ Wizard · Auto-Fix & Repair"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  wizard-analyze:
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/wizard'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref || github.head_ref }}

      - name: Configure Git
        run: |
          git config user.name "Wizard Bot"
          git config user.email "wizard-bot@ciphertube.io"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --filter @cipher-tube/wizard...

      - name: Run Wizard Analysis
        id: wizard
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Determine if we should apply fixes
          FIX_FLAG=""
          if [[ "$COMMENT_BODY" == *"/wizard fix"* ]] || [[ "$EVENT_NAME" == "pull_request" ]]; then
            FIX_FLAG="--fix"
          fi

          # Run engine and capture output
          npx tsx wizard/src/index.ts $FIX_FLAG > wizard-report.md

      - name: Post Wizard Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('wizard-report.md', 'utf8');
            const issue_number = context.payload.pull_request ? context.payload.pull_request.number : context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: report
            });

  wizard-rebase:
    if: github.event_name == 'issue_comment' && contains(github.event.comment.body, '/wizard rebase')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attempt Smart Rebase
        run: |
          git config user.name "Wizard Bot"
          git config user.email "wizard-bot@ciphertube.io"
          pnpm install --filter @cipher-tube/wizard...
          npx tsx -e "import { MergeResolver } from './wizard/src/resolve-conflicts'; new MergeResolver().attemptSmartMerge()"
