name: "CypherTube DevSecOps Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Triggers a deeper weekly sweep automatically every Monday at 4:30 AM UTC
    - cron: '30 4 * * 1'

jobs:
  analyze:
    name: Analyze Code Integrity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports: javascript-typescript, python, go, ruby, java-kotlin, c-cpp, csharp
        # Scanning our primary web stack first
        language: [ 'javascript-typescript' ]

    steps:
    - name: Checkout CypherTube Codebase
      uses: actions/checkout@v4

    - name: Initialize CodeQL Engine
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # LINKING YOUR INFRASTRUCTURE:
        # If you build custom query suites inside your code-l-cypherTube fork,
        # uncomment the line below to enforce your custom rules automatically:
        # queries: ightevenmckane187/code-l-cypherTube/suites/custom.qls@main

    - name: AutoBuild Dependencies
      uses: github/codeql-action/autobuild@v3

    - name: Execute Semantic Security Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
